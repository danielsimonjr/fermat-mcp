name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (Daniel runs it
        # locally on Windows), but CI was Linux-only — it never tested the OS the
        # server actually ships on.
        os: [ubuntu-latest, windows-latest]

    # Run every `run:` step under bash on BOTH platforms. Windows would otherwise
    # default to PowerShell, which cannot parse the bash idiom below
    # (`pytest -q || [ $? -eq 5 ]`, which tolerates pytest's exit-5 "no tests
    # collected") — it fails with a ParserError before any test runs.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e .
      # -q; tolerate exit code 5 ("no tests collected") so a repo without tests still passes.
      - run: pytest -q || [ $? -eq 5 ]
